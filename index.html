<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Royal Home Health Care, Inc. | Home Health Care in Van Nuys, CA</title>
    <meta name="description" content="Licensed home health care from Royal Home Health Care, Inc.: skilled nursing, wound care, IV therapy, injections, catheter care and recovery programs at home across Los Angeles, Ventura, San Bernardino and Orange Counties." />
    <meta name="author" content="Embra Technologies (https://embratechnologies.org)" />
    <meta name="creator" content="Embra Technologies (Embra Tech)" />
    <link rel="author" href="https://embratechnologies.org" />
    <meta name="theme-color" content="#12260c" />
    <!--app-head-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Web fonts load without blocking the first paint; text shows immediately in a fallback font. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..600;1,400..600&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..600;1,400..600&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400..600;1,400..600&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
      />
    </noscript>
    <script>
      /* Runs before the first paint:
         - restore the visitor's "reduce motion" choice
         - "js" class enables the hero entrance animation; if the app hasn't started within
           4 seconds it is removed so nothing ever stays hidden. */
      (function () {
        var html = document.documentElement;
        html.classList.add("js");
        try {
          if (localStorage.getItem("rhhc-motion-off") === "1") html.classList.add("motion-off");
        } catch (e) {}
        setTimeout(function () {
          if (!window.__rhhcReady) html.classList.remove("js");
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <p style="padding:1rem;text-align:center;font-family:sans-serif">
        Call Royal Home Health Care at <a href="tel:+18186305702">(818) 630-5702</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
